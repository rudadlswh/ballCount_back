plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.kbo'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// Security fixes newer than the Spring Boot BOM; keep each dependency family aligned.
ext {
    set('jackson-bom.version', '3.1.8')
    set('jackson-2-bom.version', '2.21.8')
    set('tomcat.version', '11.0.25')
    set('commons-lang3.version', '3.21.0')
    set('log4j2.version', '2.25.5')
    set('postgresql.version', '42.7.14')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-jackson2'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.3'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.webjars:swagger-ui:5.33.2'
    implementation 'org.webjars.npm:htmx.org:2.0.4'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}
