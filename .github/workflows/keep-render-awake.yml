name: keep-render-awake

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Ping Render
        shell: bash
        env:
          PING_URL: https://kboscore-back.onrender.com/healthz
        run: |
          set -u

          echo "Ping target: $PING_URL"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"

          for i in 1 2 3 4; do
            echo "Attempt $i"

            if curl -fsS --connect-timeout 20 --max-time 90 "$PING_URL"; then
              echo
              echo "ping success"
              exit 0
            fi

            echo "ping failed, retrying..."
            sleep 15
          done

          echo "ping failed after retries"
          exit 1