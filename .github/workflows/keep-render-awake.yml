name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend during KST service window
        run: |
          KST_DOW=$(TZ=Asia/Seoul date +%u)
          KST_HOUR=$(TZ=Asia/Seoul date +%H)
          KST_TIME=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')

          echo "KST time: $KST_TIME"
          echo "KST day-of-week: $KST_DOW"
          echo "KST hour: $KST_HOUR"

          SHOULD_PING=false

          # Weekdays Mon-Fri, KST 14:00~22:59
          if [ "$KST_DOW" -ge 1 ] && [ "$KST_DOW" -le 5 ] && [ "$KST_HOUR" -ge 14 ] && [ "$KST_HOUR" -le 22 ]; then
            SHOULD_PING=true
          fi

          # Weekends Sat-Sun, KST 10:00~22:59
          if [ "$KST_DOW" -ge 6 ] && [ "$KST_HOUR" -ge 10 ] && [ "$KST_HOUR" -le 22 ]; then
            SHOULD_PING=true
          fi

          if [ "$SHOULD_PING" != "true" ]; then
            echo "Outside keep-awake window. Skipping ping."
            exit 0
          fi

          URL="https://kboscore-back.onrender.com/healthz"
          echo "Ping: $URL"

          status_code=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            -H "User-Agent: github-actions-kbo-keep-alive" \
            -H "X-KBO-Keep-Alive: github-actions" \
            "$URL")
          curl_exit_code=$?

          echo "curl exit code: $curl_exit_code"
          echo "HTTP status: $status_code"

          if [ "$curl_exit_code" -ne 0 ]; then
            echo "curl failed"
            exit 1
          fi

          if [ "$status_code" -ge 500 ]; then
            echo "server error"
            exit 1
          fi

          echo "ping succeeded"
