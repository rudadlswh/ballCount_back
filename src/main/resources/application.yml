spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: kbo-crawler-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/kbo}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: kbo_crawler_api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: kbo_crawler_api
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: kbo_crawler_api
    schemas: kbo_crawler_api
    create-schemas: true

server:
  shutdown: graceful
  port: 8088

app:
  scheduler:
    enabled: false
    pregame-enabled: true
    live-enabled: false
    post-final-enabled: true
    pregame-interval: PT30M
    live-interval: PT15S
    post-final-interval: PT60S
