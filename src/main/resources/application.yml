spring:
  config:
    import: optional:file:./.env[.properties]
  profiles:
    group:
      prod: production
      dev: development
  application:
    name: kbo-crawler-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: ${app.db.schema}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:600000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:120000}
      data-source-properties:
        tcpKeepAlive: ${DB_TCP_KEEP_ALIVE:true}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${app.db.schema}
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${app.db.schema}
    schemas: ${app.db.schema}
    create-schemas: true
    placeholders:
      appSchema: ${app.db.schema}

server:
  shutdown: graceful
  port: ${SERVER_PORT:8088}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${ADMIN_SESSION_COOKIE_SECURE:false}

app:
  admin-ui:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    session-timeout: ${ADMIN_SESSION_TIMEOUT:30m}
    stale-game-threshold: ${ADMIN_STALE_GAME_THRESHOLD:2m}
    log-capacity: ${ADMIN_LOG_CAPACITY:2000}
  db:
    schema: ${APP_DB_SCHEMA:kbo_crawler_api_dev}
  security:
    admin-api-key: ${ADMIN_API_KEY:}
    registration-request-max-bytes: ${REGISTRATION_REQUEST_MAX_BYTES:32768}
    registration-rate-limit-enabled: ${REGISTRATION_RATE_LIMIT_ENABLED:true}
    registration-rate-limit-max-requests: ${REGISTRATION_RATE_LIMIT_MAX_REQUESTS:12}
    registration-rate-limit-window: ${REGISTRATION_RATE_LIMIT_WINDOW:1m}
  sync:
    enabled: ${APP_SYNC_ENABLED:false}
  live-sync:
    lock-mode: ${KBO_LIVE_SYNC_LOCK_MODE:memory}
    scheduler-interval: ${KBO_LIVE_SYNC_SCHEDULER_INTERVAL:PT1S}
    retry-interval: ${KBO_LIVE_SYNC_RETRY_INTERVAL:PT10S}
    idle-interval: ${KBO_LIVE_SYNC_IDLE_INTERVAL:PT30M}
    pregame-check-interval: ${KBO_LIVE_SYNC_PREGAME_CHECK_INTERVAL:PT5M}
    pregame-fast-polling-window: ${KBO_LIVE_SYNC_PREGAME_FAST_POLLING_WINDOW:PT30M}
    pregame-fast-polling-interval: ${KBO_LIVE_SYNC_PREGAME_FAST_POLLING_INTERVAL:PT1M}
    live-polling-interval: ${KBO_LIVE_SYNC_LIVE_POLLING_INTERVAL:${KBO_LIVE_SYNC_SCHEDULER_INTERVAL:PT1S}}
    final-confirmation-polling-interval: ${KBO_LIVE_SYNC_FINAL_CONFIRMATION_POLLING_INTERVAL:PT30S}
    detail-extraction-timeout: PT0.1S
    pregame-ttl: PT3M
    live-ttl: PT3S
    final-confirmation-ttl: PT30S
  apns:
    push-enabled: ${KBO_PUSH_ENABLED:true}
    team-id: ${APNS_TEAM_ID:}
    key-id: ${APNS_KEY_ID:}
    bundle-id: ${APNS_BUNDLE_ID:}
    private-key-path: ${APNS_PRIVATE_KEY_PATH:}
#    private-key: ${APNS_PRIVATE_KEY:}
    env: ${APNS_ENV:sandbox}
    test-enabled: ${KBO_APNS_TEST_ENABLED:false}
  fcm:
    push-enabled: ${KBO_FCM_PUSH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    environment: ${FCM_ENV:${APNS_ENV:sandbox}}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
#    credentials-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    endpoint: ${FCM_ENDPOINT:https://fcm.googleapis.com}

kbo:
  admin:
    api-key: ${KBO_ADMIN_API_KEY:}
  reconcile:
    public-max-dates: ${KBO_RECONCILE_PUBLIC_MAX_DATES:3}
    public-allowed-past-days: ${KBO_RECONCILE_PUBLIC_ALLOWED_PAST_DAYS:7}
    public-cooldown: ${KBO_RECONCILE_PUBLIC_COOLDOWN:3m}
    admin-max-dates: ${KBO_RECONCILE_ADMIN_MAX_DATES:31}
  http:
    connect-timeout: ${KBO_HTTP_CONNECT_TIMEOUT:3s}
    read-timeout: ${KBO_HTTP_READ_TIMEOUT:8s}
    request-timeout: ${KBO_HTTP_REQUEST_TIMEOUT:10s}
