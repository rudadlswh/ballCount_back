spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: kbo-crawler-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: kbo_crawler_api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: kbo_crawler_api
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: kbo_crawler_api
    schemas: kbo_crawler_api
    create-schemas: true

server:
  shutdown: graceful
  port: 8088

app:
  scheduler:
    enabled: false
    pregame-enabled: true
    live-enabled: false
    post-final-enabled: true
    pregame-interval: PT30M
    live-interval: PT15S
    post-final-interval: PT10S
  live-sync:
    enabled: ${KBO_LIVE_SYNC_ENABLED:false}
    scheduler-interval: PT10S
    pregame-ttl: PT3M
    live-ttl: PT15S
    final-confirmation-ttl: PT2M
  apns:
    push-enabled: ${KBO_PUSH_ENABLED:true}
    team-id: ${APNS_TEAM_ID:}
    key-id: ${APNS_KEY_ID:}
    bundle-id: ${APNS_BUNDLE_ID:}
    private-key-path: ${APNS_PRIVATE_KEY_PATH:}
#    private-key: ${APNS_PRIVATE_KEY:}
    env: ${APNS_ENV:sandbox}
    test-enabled: ${KBO_APNS_TEST_ENABLED:false}
