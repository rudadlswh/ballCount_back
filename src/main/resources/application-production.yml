spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    include-message: never

logging:
  level:
    root: INFO
    com.kbo.crawlerapi: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
    org.springframework.web: WARN

app:
  security:
    admin-api-key: ${ADMIN_API_KEY:}
    registration-request-max-bytes: ${REGISTRATION_REQUEST_MAX_BYTES:32768}
    registration-rate-limit-enabled: ${REGISTRATION_RATE_LIMIT_ENABLED:true}
    registration-rate-limit-max-requests: ${REGISTRATION_RATE_LIMIT_MAX_REQUESTS:12}
    registration-rate-limit-window: ${REGISTRATION_RATE_LIMIT_WINDOW:1m}
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:false}
    pregame-enabled: ${APP_SCHEDULER_PREGAME_ENABLED:true}
    live-enabled: ${APP_SCHEDULER_LIVE_ENABLED:false}
    post-final-enabled: ${APP_SCHEDULER_POST_FINAL_ENABLED:true}
  live-sync:
    enabled: ${KBO_LIVE_SYNC_ENABLED:false}
  apns:
    push-enabled: ${KBO_PUSH_ENABLED:false}
    team-id: ${APNS_TEAM_ID:}
    key-id: ${APNS_KEY_ID:}
    bundle-id: ${APNS_BUNDLE_ID:com.chogm.kboScore}
    private-key-path: ${APNS_PRIVATE_KEY_PATH:}
    env: ${APNS_ENV:production}
    test-enabled: ${KBO_APNS_TEST_ENABLED:false}

kbo:
  admin:
    api-key: ${KBO_ADMIN_API_KEY:}
