<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow"><title>오류 의심 건 · KBO 운영실</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{admin/fragments/sidebar :: sidebar(${activePage})}"></aside>
    <main class="main">
        <header class="page-header"><div><p class="eyebrow">AUTOMATIC DETECTION</p><h1>오류 의심 건</h1><p>갱신 정체, 주자 데이터 불일치, 최근 24시간 알림 실패를 자동 탐지합니다.</p></div><span class="count count--danger" th:text="${issues.size()}">0</span></header>
        <section class="panel">
            <div class="empty-state" th:if="${issues.empty}"><span>✓</span><strong>현재 탐지된 오류 의심 건이 없습니다.</strong><small>대시보드 갱신 시 최신 상태로 다시 계산됩니다.</small></div>
            <div class="issue-list" th:unless="${issues.empty}">
                <article class="issue issue--linked" th:each="issue : ${issues}">
                    <span class="badge" th:classappend="${'badge--' + issue.tone}" th:text="${issue.type}">유형</span>
                    <div><a th:href="@{/admin/games/{id}(id=${issue.gameId})}" th:text="${issue.gameId}">GAME</a><strong th:text="${issue.title}">제목</strong><p th:text="${issue.detail}">상세</p></div>
                    <time th:text="${issue.detectedAt}">-</time>
                </article>
            </div>
        </section>
    </main>
</div>
</body>
</html>
