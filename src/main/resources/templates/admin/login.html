<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>관리자 로그인 · KBO 운영실</title>
    <meta name="color-scheme" content="light dark">
    <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
    <script src="/admin/assets/admin.js" th:src="@{/admin/assets/admin.js}"></script>
    <link rel="stylesheet" href="/admin/assets/admin.css" th:href="@{/admin/assets/admin.css}">
</head>
<body class="login-page">
<a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
<main class="login-shell" id="main-content" tabindex="-1">
    <section class="login-card">
        <div class="brand brand--login">
            <span th:replace="~{admin/fragments/sidebar :: brandMark}"></span>
            <span><strong>KBO 운영실</strong><small>경기와 알림을 한눈에</small></span>
        </div>
        <div class="login-card__intro">
            <p class="eyebrow">관리자 전용</p>
            <h1>관리자 로그인</h1>
            <p>경기 수집과 알림 상태를 한곳에서 점검합니다.</p>
        </div>
        <div class="alert alert--danger" role="alert" th:if="${loginError}" th:text="${loginError}"></div>
        <div class="alert alert--warning" role="status" th:if="${configurationMissing}">
            <code>ADMIN_PASSWORD</code> 환경변수가 설정되지 않아 로그인할 수 없습니다.
        </div>
        <form class="login-form" method="post" action="/admin/login" th:action="@{/admin/login}" autocomplete="on">
            <label>
                <span>아이디</span>
                <input name="username" type="text" autocomplete="username" required autofocus autocapitalize="none" spellcheck="false"
                       th:value="${username}">
            </label>
            <label>
                <span>비밀번호</span>
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="button button--primary button--full" type="submit" th:disabled="${configurationMissing}">로그인</button>
        </form>
        <div class="appearance-control" hidden>
            <label for="appearance">화면 모드</label>
            <select id="appearance" data-appearance><option value="system">시스템 설정</option><option value="light">라이트</option><option value="dark">다크</option></select>
        </div>
        <p class="login-card__note">세션은 일정 시간 활동이 없으면 자동으로 만료됩니다.</p>
    </section>
</main>
</body>
</html>
