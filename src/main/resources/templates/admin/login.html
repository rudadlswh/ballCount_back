<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>관리자 로그인 · KBO 운영실</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-card">
        <div class="brand brand--login">
            <span class="brand__mark">K</span>
            <span><strong>KBO 운영실</strong><small>Operations console</small></span>
        </div>
        <div class="login-card__intro">
            <p class="eyebrow">AUTHORIZED PERSONNEL ONLY</p>
            <h1>관리자 로그인</h1>
            <p>경기 수집과 알림 상태를 한곳에서 점검합니다.</p>
        </div>
        <div class="alert alert--danger" th:if="${loginError}" th:text="${loginError}"></div>
        <div class="alert alert--warning" th:if="${configurationMissing}">
            <code>ADMIN_PASSWORD</code> 환경변수가 설정되지 않아 로그인할 수 없습니다.
        </div>
        <form class="login-form" method="post" action="/admin/login" autocomplete="on">
            <label>
                <span>아이디</span>
                <input name="username" type="text" autocomplete="username" required autofocus
                       th:value="${username}">
            </label>
            <label>
                <span>비밀번호</span>
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="button button--primary button--full" type="submit">운영실 입장</button>
        </form>
        <p class="login-card__note">세션은 일정 시간 활동이 없으면 자동으로 만료됩니다.</p>
    </section>
</main>
</body>
</html>
