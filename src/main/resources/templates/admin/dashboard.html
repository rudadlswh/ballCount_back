<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>대시보드 · KBO 운영실</title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
    <script defer src="/webjars/htmx.org/2.0.4/dist/htmx.min.js"></script>
    <script defer src="/admin/assets/async-form.js"></script>
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{admin/fragments/sidebar :: sidebar(${activePage})}"></aside>
    <main class="main">
        <header class="page-header">
            <div><p class="eyebrow">LIVE OPERATIONS</p><h1>대시보드</h1></div>
            <div class="live-pill"><span></span>15초 자동 갱신</div>
        </header>
        <section th:replace="~{admin/fragments/dashboard :: content}"></section>
        <section id="schedule-import-panel"
                 class="panel schedule-import-panel"
                 data-async-panel
                 aria-labelledby="schedule-import-title"
                 aria-busy="false">
            <div class="panel__header">
                <div><p class="eyebrow">MANUAL SCHEDULE IMPORT</p><h2 id="schedule-import-title">월간 일정 수동 수집</h2></div>
                <span class="badge badge--muted">최대 3개월</span>
            </div>
            <p class="panel-description">KBO 공식 월간 일정을 다시 읽어 신규 경기 추가와 변경 사항을 반영합니다.</p>

            <div class="alert"
                 th:if="${scheduleImportResult != null}"
                 th:classappend="${scheduleImportResult.failedMonthCount == 0} ? 'alert--success' : 'alert--warning'"
                 role="status"
                 tabindex="-1"
                 data-async-feedback>
                <strong th:text="${scheduleImportResult.succeededMonthCount + '/' + scheduleImportResult.requestedMonthCount + '개월 수집 완료'}">2/2개월 수집 완료</strong>
                <span th:text="${' · 신규 ' + scheduleImportResult.createdCount + '경기 · 갱신 ' + scheduleImportResult.updatedCount + '경기 · 건너뜀 ' + scheduleImportResult.skippedCount + '건'}">결과</span>
            </div>
            <div class="alert alert--danger"
                 th:if="${scheduleImportError != null}"
                 th:text="${scheduleImportError}"
                 role="alert"
                 tabindex="-1"
                 data-async-feedback>수집 실패</div>
            <div class="alert alert--danger"
                 hidden
                 role="alert"
                 tabindex="-1"
                 data-async-client-error>요청을 완료하지 못했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.</div>

            <form id="schedule-import-form"
                  class="filter-bar schedule-import-form"
                  method="post"
                  action="/admin/schedule/import"
                  hx-post="/admin/schedule/import"
                  hx-target="#schedule-import-panel"
                  hx-select="#schedule-import-panel"
                  hx-swap="outerHTML"
                  hx-indicator="#schedule-import-loading"
                  data-async-form
                  data-async-panel="#schedule-import-panel"
                  aria-describedby="schedule-import-help">
                <label><span>시작 월</span><input type="month" name="fromMonth" required th:value="${scheduleImportFromMonth}"></label>
                <label><span>종료 월</span><input type="month" name="toMonth" required th:value="${scheduleImportToMonth}"></label>
                <button class="button button--primary" type="submit">
                    <span class="button__idle-label">일정 수집 실행</span>
                    <span class="button__loading-label" aria-hidden="true">수집 중…</span>
                </button>
            </form>

            <div th:replace="~{admin/fragments/async-state :: loading('schedule-import-loading', '월간 일정을 수집하고 있습니다', '선택한 기간에 따라 잠시 시간이 걸릴 수 있습니다. 창을 닫지 마세요.')}"></div>

            <div data-async-content>
                <div th:if="${scheduleImportResult == null and scheduleImportError == null}"
                     th:replace="~{admin/fragments/async-state :: empty('schedule-import-empty', '아직 수집 결과가 없습니다', '시작 월과 종료 월을 선택한 뒤 일정 수집을 실행해 주세요.')}"></div>

                <div th:if="${scheduleImportResult != null and #lists.isEmpty(scheduleImportResult.months)}"
                     th:replace="~{admin/fragments/async-state :: empty('schedule-import-empty-result', '처리할 일정이 없습니다', '선택한 기간의 수집 결과에 월별 데이터가 없습니다.')}"></div>

                <div class="table-wrap" th:if="${scheduleImportResult != null and !#lists.isEmpty(scheduleImportResult.months)}">
                    <table>
                        <caption class="sr-only">월간 일정 수동 수집 결과</caption>
                        <thead><tr><th>대상 월</th><th>상태</th><th>신규</th><th>갱신</th><th>건너뜀</th><th>오류</th></tr></thead>
                        <tbody>
                        <tr th:each="month : ${scheduleImportResult.months}">
                            <td class="mono" th:text="${month.month}">2026-09</td>
                            <td><span class="badge" th:classappend="${month.succeeded} ? 'badge--success' : 'badge--danger'" th:text="${month.succeeded} ? '성공' : '실패'">성공</span></td>
                            <td th:text="${month.createdCount}">0</td>
                            <td th:text="${month.updatedCount}">0</td>
                            <td th:text="${month.skippedCount}">0</td>
                            <td class="text-danger" th:text="${month.errorMessage == null ? '-' : month.errorMessage}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <small id="schedule-import-help" class="panel-note">수집 후 앱 일정 화면에서 아래로 당겨 새로고침하면 최신 데이터가 표시됩니다.</small>
        </section>
    </main>
</div>
</body>
</html>
