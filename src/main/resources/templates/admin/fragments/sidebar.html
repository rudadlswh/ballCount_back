<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(activePage)">
    <a class="brand" href="/admin/dashboard" aria-label="KBO 운영실 대시보드">
        <span class="brand__mark">K</span>
        <span><strong>KBO 운영실</strong><small>Operations console</small></span>
    </a>
    <nav class="nav" aria-label="관리자 메뉴">
        <a href="/admin/dashboard" th:classappend="${activePage == 'dashboard'} ? 'is-active'">
            <span class="nav__icon">⌁</span>대시보드
        </a>
        <a href="/admin/issues" th:classappend="${activePage == 'issues'} ? 'is-active'">
            <span class="nav__icon">!</span>오류 의심 건
        </a>
        <a href="/admin/notifications" th:classappend="${activePage == 'notifications'} ? 'is-active'">
            <span class="nav__icon">↗</span>알림 발송 내역
        </a>
        <a href="/admin/logs" th:classappend="${activePage == 'logs'} ? 'is-active'">
            <span class="nav__icon">≡</span>로그
        </a>
    </nav>
    <div class="sidebar__footer">
        <span class="status-dot"></span> 관리자 세션 활성
        <form method="post" action="/admin/logout">
            <button class="button button--ghost button--full" type="submit">로그아웃</button>
        </form>
    </div>
</aside>
</body>
</html>
