services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-ghcr.io/rudadlswh/kboscore_back}:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: "8088"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
